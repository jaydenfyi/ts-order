name: Release

on:
    push:
        branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
    contents: write # push the version commit and create GitHub releases
    pull-requests: write # open the "Version Packages" pull request
    id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: oven-sh/setup-bun@v2
            # Node 24 ships npm 11, which supports trusted publishing.
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
            - run: bun install --frozen-lockfile
            # With pending changesets, open or update the "Version Packages" pull
            # request. When that pull request merges, build and publish to npm.
            - uses: changesets/action@v1
              with:
                  version: bun run version-packages
                  publish: bun run release
                  title: Version Packages
                  commit: 'chore: version packages'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NPM_CONFIG_PROVENANCE: 'true'
