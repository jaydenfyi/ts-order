name: Release

# A push to main does two independent things:
#
# - With pending changesets, the version job opens or updates the "Version
#   Packages" pull request.
# - When the version in package.json is not on npm yet (that pull request
#   merged), check, build and publish stage it on npm. A maintainer reviews and
#   approves the staged version with 2FA on npmjs.com. Then github-release tags
#   the commit and creates the GitHub release.
#
# Only publish can get an OIDC token for npm, and it installs no dependencies:
# it publishes the tarball that build packed.

on:
    push:
        branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
    version:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write # push the "Version Packages" branch
            pull-requests: write # open the "Version Packages" pull request
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  no-cache: true
            - run: bun install --frozen-lockfile
            # v2 understands the .changeset/pre/ folder of Changesets 3 pre mode, and
            # pushes through the GitHub API with its github-token input.
            - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
              with:
                  version-script: bun run version-packages
                  pr-title: Version Packages
                  commit-message: 'chore: version packages'

    check:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
        outputs:
            publish: ${{ steps.check.outputs.publish }}
            version: ${{ steps.check.outputs.version }}
            tag: ${{ steps.check.outputs.tag }}
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false
            - id: check
              run: |
                  version=$(node -p "require('./package.json').version")
                  # A prerelease such as 0.1.0-alpha.0 goes to its tag (alpha), others to latest.
                  case "$version" in
                    *-*) tag=${version#*-}; tag=${tag%%.*} ;;
                    *) tag=latest ;;
                  esac
                  if npm view "ts-order@$version" version >/dev/null 2>&1; then
                    publish=false
                  else
                    publish=true
                  fi
                  echo "ts-order@$version on $tag: publish=$publish"
                  {
                    echo "publish=$publish"
                    echo "version=$version"
                    echo "tag=$tag"
                  } >> "$GITHUB_OUTPUT"

    build:
        needs: check
        if: needs.check.outputs.publish == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  no-cache: true
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 24
            - run: bun install --frozen-lockfile
            - run: bun run build
            - run: bun run test
            - run: bun run test:compile
            - run: npm pack --ignore-scripts
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: package
                  path: ts-order-${{ needs.check.outputs.version }}.tgz
                  if-no-files-found: error
                  retention-days: 1

    publish:
        needs: [check, build]
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            id-token: write # npm trusted publishing (OIDC) and provenance
        steps:
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: package
            # Node 24 ships npm 11, which supports trusted publishing (11.5.1+)
            # and staged publishing. No registry-url: its .npmrc token would
            # override OIDC.
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 24
            - run: npm --version
            - run: npm stage publish "./ts-order-$VERSION.tgz" --tag "$TAG" --ignore-scripts
              env:
                  VERSION: ${{ needs.check.outputs.version }}
                  TAG: ${{ needs.check.outputs.tag }}

    github-release:
        needs: [check, publish]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: write # create the tag and the GitHub release
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false
            - run: |
                  # The CHANGELOG.md section for this version, without its heading.
                  awk -v v="## $VERSION" '$0 == v { found = 1; next } found && /^## / { exit } found' CHANGELOG.md > notes.md
                  prerelease=$([ "$TAG" = latest ] && echo false || echo true)
                  gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md --prerelease="$prerelease"
              env:
                  GH_TOKEN: ${{ github.token }}
                  VERSION: ${{ needs.check.outputs.version }}
                  TAG: ${{ needs.check.outputs.tag }}
